<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>9圍紀錄</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #007AFF;
            --secondary-color: #5856D6;
            --background-color: #F2F2F7;
            --card-background: #FFFFFF;
            --text-primary: #000000;
            --text-secondary: #8E8E93;
            --border-color: #C6C6C8;
            --success-color: #34C759;
            --error-color: #FF3B30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #FF9500, #FF3B30);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .content {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .form-card {
            background: var(--card-background);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .form-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            background: var(--background-color);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .form-row-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FF9500, #FF3B30);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 149, 0, 0.3);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .save-btn:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            background: var(--success-color);
            color: white;
            padding: 14px 24px;
            border-radius: 14px;
            text-align: center;
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2000;
            min-width: 220px;
            max-width: min(90vw, 320px);
            box-shadow: 0 18px 40px rgba(52, 199, 89, 0.28);
        }

        .success-message.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-upload {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .photo-upload:hover {
            border-color: var(--primary-color);
            background: rgba(0, 122, 255, 0.05);
        }

        .photo-upload input[type="file"] {
            display: none;
        }

        .photo-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }

        .photo-preview.show {
            display: block;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .upload-text {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        @media screen and (max-width: 428px) {
            .header {
                padding: 16px;
            }
            
            .header h1 {
                font-size: 1rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-row-2 {
                grid-template-columns: 1fr;
            }

            .content {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="customer.html" class="back-btn">← 返回</a>
            <h1>9圍紀錄</h1>
        </div>
    </div>

    <div class="content">
        <div class="success-message" id="successMessage">資料已儲存！</div>

        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>載入中...</p>
        </div>

        <div class="form-card" id="formCard" style="display: none;">
            <div class="form-title">📝 新增9圍紀錄</div>

            <form id="dataForm">
                <div class="form-group">
                    <label class="form-label">記錄日期</label>
                    <input type="date" class="form-input" id="紀錄日期" required>
                </div>

                <div class="section-title" style="margin-top:20px;">9圍測量</div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">胸圍 (cm)</label>
                        <input type="number" class="form-input" id="胸圍" step="0.1" placeholder="例如：90" min="0" onkeydown="return event.key !== '-'">
                    </div>
                    <div class="form-group">
                        <label class="form-label">腰圍 (cm)</label>
                        <input type="number" class="form-input" id="腰圍" step="0.1" placeholder="例如：80" min="0" onkeydown="return event.key !== '-'">
                    </div>
                    <div class="form-group">
                        <label class="form-label">臀圍 (cm)</label>
                        <input type="number" class="form-input" id="臀圍" step="0.1" placeholder="例如：95" min="0" onkeydown="return event.key !== '-'">
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">左手臂圍 (cm)</label>
                        <input type="number" class="form-input" id="左手臂圍" step="0.1" placeholder="例如：30" min="0" onkeydown="return event.key !== '-'">
                    </div>
                    <div class="form-group">
                        <label class="form-label">右手臂圍 (cm)</label>
                        <input type="number" class="form-input" id="右手臂圍" step="0.1" placeholder="例如：30" min="0" onkeydown="return event.key !== '-'">
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">左大腿圍 (cm)</label>
                        <input type="number" class="form-input" id="左大腿圍" step="0.1" placeholder="例如：55" min="0" onkeydown="return event.key !== '-'">
                    </div>
                    <div class="form-group">
                        <label class="form-label">右大腿圍 (cm)</label>
                        <input type="number" class="form-input" id="右大腿圍" step="0.1" placeholder="例如：55" min="0" onkeydown="return event.key !== '-'">
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">左小腿圍 (cm)</label>
                        <input type="number" class="form-input" id="左小腿圍" step="0.1" placeholder="例如：38" min="0" onkeydown="return event.key !== '-'">
                    </div>
                    <div class="form-group">
                        <label class="form-label">右小腿圍 (cm)</label>
                        <input type="number" class="form-input" id="右小腿圍" step="0.1" placeholder="例如：38" min="0" onkeydown="return event.key !== '-'">
                    </div>
                </div>

                <div class="section-title" style="margin-top:20px;">照片上傳</div>
                <div class="form-group">
                    <label>上傳照片（可多張）</label>
                    <div class="photo-upload" id="photoUpload">
                        <input type="file" id="photo" name="photo" accept="image/*" multiple capture="environment">
                        <div class="upload-text">點擊上傳照片（可多張）</div>
                    </div>
                    <div id="photoPreviewContainer" style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;"></div>
                </div>

                <button type="submit" class="save-btn" id="saveBtn">儲存資料</button>
                <button type="button" class="save-btn" id="cancelBtn" style="background:#8E8E93;margin-top:10px;">取消</button>
            </form>
        </div>

        <div id="recordsList"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-storage.js";
        import { ensureUserOrgProfile, resolveUserContext, withOrgContext } from "./org-context.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCyK0sGYh_M-bJUE4NhZJxz5HkllW4jXxw",
            authDomain: "akso-weightcontroll.firebaseapp.com",
            projectId: "akso-weightcontroll",
            storageBucket: "akso-weightcontroll.firebasestorage.app",
            messagingSenderId: "523229071422",
            appId: "1:523229071422:web:c36fd110cc5812fea2a96f",
            measurementId: "G-DFEEKX4V0S"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;
        let existingDocId = null;
        let currentOrgContext = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            currentUser = user;
            currentOrgContext = await resolveUserContext(db, user, { savedUsername: localStorage.getItem('twkt_username') || '' });
            await ensureUserOrgProfile(db, user, currentOrgContext);
            if (currentOrgContext.role !== 'student') {
                await signOut(auth);
                window.location.replace('index.html');
                return;
            }
            
            loadData(user.uid);
        });

        window.onpageshow = function(event) {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.replace('login.html');
                } else {
                    const pageContext = await resolveUserContext(db, user, { savedUsername: localStorage.getItem('twkt_username') || '' });
                    if (pageContext.role !== 'student') {
                        await signOut(auth);
                        window.location.replace('index.html');
                    }
                }
            });
        };

        let currentLoadToken = 0;
        async function loadData(userId) {
            const token = ++currentLoadToken;
            console.log('loadData 開始, token:', token, 'userId:', userId);
            try {
                if (!userId) {
                    console.warn('userId 為空，無法載入資料');
                    return;
                }
                const q = query(
                    collection(db, "原始體重三圍"),
                    where("userId", "==", userId)
                );
                const querySnapshot = await getDocs(q);
                console.log('getDocs 完成, token:', token, '文件數:', querySnapshot.size);

                document.getElementById('loading').style.display = 'none';

                if (token !== currentLoadToken) {
                    console.log('token 不匹配，跳過更新');
                    return;
                }

                const records = [];
                querySnapshot.forEach((doc) => {
                    records.push({ id: doc.id, ...doc.data() });
                });
                records.sort((a, b) => new Date(b.紀錄日期) - new Date(a.紀錄日期));

                const recordsList = document.getElementById('recordsList');
                if (!recordsList) {
                    console.warn('recordsList 元素不存在');
                    return;
                }

                if (records.length === 0) {
                    recordsList.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="font-weight:600;color:#333;">紀錄列表</div>
                            <button onclick="showForm()" style="padding:6px 14px;background:#34C759;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:500;">+ 新增</button>
                        </div>
                        <div style="text-align:center;color:#8E8E93;padding:40px;">尚無紀錄</div>
                    `;
                } else {
                    renderRecords(records);
                    console.log('renderRecords 完成');
                }

            } catch (error) {
                console.error('載入資料失敗:', error);
                document.getElementById('loading').style.display = 'none';
                if (token !== currentLoadToken) return;
                const recordsList = document.getElementById('recordsList');
                if (recordsList && !recordsList.innerHTML.trim()) {
                    recordsList.innerHTML = `
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                            <div style="font-weight:600;color:#333;">紀錄列表</div>
                            <button onclick="showForm()" style="padding:6px 14px;background:#34C759;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:500;">+ 新增</button>
                        </div>
                        <div style="text-align:center;color:#ef4444;padding:40px;">載入失敗，請重新整理頁面</div>
                    `;
                }
            }
        }

        function renderRecords(records) {
            const recordsList = document.getElementById('recordsList');
            const formCard = document.getElementById('formCard');

            formCard.style.display = 'none';

            recordsList.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <div style="font-weight:600;color:#333;">紀錄列表</div>
                    <button onclick="showForm()" style="padding:6px 14px;background:#34C759;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:500;">+ 新增</button>
                </div>
                ${records.map((r) => `
                <div class="form-card" data-record-id="${r.id}" style="margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <div style="font-weight:600;">${r.紀錄日期 || '-'}</div>
                        <div style="display:flex;gap:8px;">
                            <button data-record-id="${r.id}" class="edit-record-btn" style="padding:6px 12px;background:#007AFF;color:white;border:none;border-radius:6px;cursor:pointer;font-size:0.8rem;">編輯</button>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:0.85rem;">
                        <div>胸圍：${r.胸圍 || '-'}</div>
                        <div>腰圍：${r.腰圍 || '-'}</div>
                        <div>臀圍：${r.臀圍 || '-'}</div>
                        <div>左手臂：${r.左手臂圍 || '-'}</div>
                        <div>右手臂：${r.右手臂圍 || '-'}</div>
                        <div>左大腿：${r.左大腿圍 || '-'}</div>
                        <div>右大腿：${r.右大腿圍 || '-'}</div>
                        <div>左小腿：${r.左小腿圍 || '-'}</div>
                        <div>右小腿：${r.右小腿圍 || '-'}</div>
                    </div>
                </div>
            `).join('')}
            `;
        }

        window.editRecord = async function(docId) {
            try {
                const docSnap = await getDoc(doc(db, "原始體重三圍", docId));
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    existingDocId = docId;
                    document.getElementById('紀錄日期').value = data.紀錄日期 || '';
                    document.getElementById('胸圍').value = data.胸圍 || '';
                    document.getElementById('腰圍').value = data.腰圍 || '';
                    document.getElementById('臀圍').value = data.臀圍 || '';
                    document.getElementById('左手臂圍').value = data.左手臂圍 || '';
                    document.getElementById('右手臂圍').value = data.右手臂圍 || '';
                    document.getElementById('左大腿圍').value = data.左大腿圍 || '';
                    document.getElementById('右大腿圍').value = data.右大腿圍 || '';
                    document.getElementById('左小腿圍').value = data.左小腿圍 || '';
                    document.getElementById('右小腿圍').value = data.右小腿圍 || '';
                    document.getElementById('formCard').style.display = 'block';
                    document.getElementById('recordsList').innerHTML = '';
                    document.querySelector('.form-title').textContent = '📝 編輯9圍紀錄';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    alert('找不到此紀錄，可能已被刪除');
                }
            } catch (error) {
                console.error('載入失敗:', error);
                alert('載入紀錄失敗：' + error.message + '\n（可能權限不足或網路問題）');
            }
        };

        window.showForm = function() {
            const formCard = document.getElementById('formCard');
            const recordsList = document.getElementById('recordsList');
            formCard.style.display = 'block';
            recordsList.innerHTML = '';
            existingDocId = null;
            document.getElementById('dataForm').reset();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('紀錄日期').value = today;
            document.querySelector('.form-title').textContent = '📝 新增9圍紀錄';
        }

        function handleCancelBtn() {
            document.getElementById('formCard').style.display = 'none';
            existingDocId = null;
            document.getElementById('dataForm').reset();
            if (typeof uploadedPhotos !== 'undefined') {
                uploadedPhotos = [];
            }
            const photoPreviewContainerEl = document.getElementById('photoPreviewContainer');
            if (photoPreviewContainerEl) {
                photoPreviewContainerEl.innerHTML = '';
            }
            const recordsList = document.getElementById('recordsList');
            if (recordsList) {
                recordsList.innerHTML = '<div style="text-align:center;color:#8E8E93;padding:40px;">載入中...</div>';
            }
            loadData(currentUser.uid);
        }

        const cancelBtnEl = document.getElementById('cancelBtn');
        if (cancelBtnEl) {
            cancelBtnEl.addEventListener('click', handleCancelBtn);
        }
        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'cancelBtn') {
                handleCancelBtn();
            }
            const editBtn = e.target.closest && e.target.closest('.edit-record-btn');
            if (editBtn) {
                e.preventDefault();
                e.stopPropagation();
                const recordId = editBtn.getAttribute('data-record-id');
                if (recordId && typeof window.editRecord === 'function') {
                    window.editRecord(recordId);
                }
            }
        });

        let uploadedPhotos = [];
        const photoUpload = document.getElementById('photoUpload');
        const photoInput = document.getElementById('photo');
        const photoPreviewContainer = document.getElementById('photoPreviewContainer');

        if (photoUpload && photoInput) {
            photoUpload.addEventListener('click', (e) => {
                if (e.target.tagName !== 'INPUT') {
                    photoInput.click();
                }
            });
            photoInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files);
                files.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const imgContainer = document.createElement('div');
                        imgContainer.style.cssText = 'position:relative;width:80px;height:80px;';

                        const img = document.createElement('img');
                        img.src = event.target.result;
                        img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:8px;';

                        const removeBtn = document.createElement('button');
                        removeBtn.innerHTML = '✕';
                        removeBtn.style.cssText = 'position:absolute;top:-5px;right:-5px;background:red;color:white;border:none;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:12px;';
                        removeBtn.onclick = () => {
                            const idx = uploadedPhotos.findIndex(p => p === file);
                            if (idx !== -1) {
                                uploadedPhotos.splice(idx, 1);
                                imgContainer.remove();
                            }
                        };

                        imgContainer.appendChild(img);
                        imgContainer.appendChild(removeBtn);
                        photoPreviewContainer.appendChild(imgContainer);
                        uploadedPhotos.push(file);
                    };
                    reader.readAsDataURL(file);
                });
            });
        }

        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '儲存中...';

            try {
                const photoFiles = uploadedPhotos.slice();
                const photoUrls = [];
                if (photoFiles.length > 0) {
                    for (let i = 0; i < photoFiles.length; i++) {
                        const photoFile = photoFiles[i];
                        const photoRef = ref(storage, `原始體重三圍/${currentUser.uid}/${Date.now()}_${i}_${photoFile.name}`);
                        await uploadBytes(photoRef, photoFile);
                        const url = await getDownloadURL(photoRef);
                        photoUrls.push(url);
                    }
                }

                const data = withOrgContext({
                    userId: currentUser.uid,
                    紀錄日期: document.getElementById('紀錄日期').value,
                    胸圍: parseFloat(document.getElementById('胸圍').value) || 0,
                    腰圍: parseFloat(document.getElementById('腰圍').value) || 0,
                    臀圍: parseFloat(document.getElementById('臀圍').value) || 0,
                    左大腿圍: parseFloat(document.getElementById('左大腿圍').value) || 0,
                    右大腿圍: parseFloat(document.getElementById('右大腿圍').value) || 0,
                    左手臂圍: parseFloat(document.getElementById('左手臂圍').value) || 0,
                    右手臂圍: parseFloat(document.getElementById('右手臂圍').value) || 0,
                    左小腿圍: parseFloat(document.getElementById('左小腿圍').value) || 0,
                    右小腿圍: parseFloat(document.getElementById('右小腿圍').value) || 0,
                    照片: photoUrls,
                    更新時間: new Date().toISOString()
                }, currentOrgContext || { companyId: 'akso-company', primaryClassId: 'akso-default-class', classIds: ['akso-default-class'] });

                if (existingDocId) {
                    await setDoc(doc(db, "原始體重三圍", existingDocId), data, { merge: true });
                } else {
                    await setDoc(doc(collection(db, "原始體重三圍")), data);
                }

                const successMsg = document.getElementById('successMessage');
                successMsg.textContent = '✓ 資料已儲存！';
                successMsg.classList.add('show');
                uploadedPhotos = [];
                if (photoPreviewContainer) photoPreviewContainer.innerHTML = '';
                setTimeout(() => {
                    successMsg.classList.remove('show');
                    loadData(currentUser.uid);
                }, 800);

            } catch (error) {
                console.error('儲存失敗:', error);
                alert('儲存失敗: ' + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '儲存資料';
            }
        });
    </script>
</body>
</html>
